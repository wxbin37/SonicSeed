<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Museed 首页概念稿</title>
  <style>
    :root{--bg:#0a0c0d;--ink:#f4f7f5;--muted:#9aa49f;--green:#72f7b0;--line:rgba(175,255,216,.16);--card:#131817}
    *{box-sizing:border-box} body{margin:0;min-width:320px;background:var(--bg);color:var(--ink);font-family:"PingFang SC",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;overflow:hidden}
    .page{position:relative;min-height:100vh;isolation:isolate;background:radial-gradient(circle at 50% 48%,#15251f 0,#0c1110 31%,#0a0c0d 67%)}
    .page:before{content:"";position:absolute;inset:0;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:52px 52px;mask-image:radial-gradient(circle at center,black,transparent 72%);z-index:-1}
    header{position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:28px 48px}.brand{font-size:20px;font-weight:650;letter-spacing:.02em}.brand span{color:var(--green)}.top-note{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
    main{position:relative;display:grid;place-items:center;min-height:calc(100vh - 88px);padding:20px 6vw 74px}.hero{position:relative;width:min(1120px,100%);height:570px;display:grid;place-items:center}.copy{text-align:center;z-index:3;max-width:460px}.eyebrow{color:var(--green);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:22px}.copy h1{margin:0;font-size:clamp(40px,5vw,68px);line-height:1.1;font-weight:580;letter-spacing:-.03em}.copy h1 em{font-style:normal;color:var(--green)}.copy p{margin:22px auto 0;color:var(--muted);font-size:15px;line-height:1.9;max-width:330px}
    .orbit{position:absolute;left:50%;top:50%;width:470px;height:470px;transform:translate(-50%,-50%);border:1px solid var(--line);border-radius:50%;opacity:.68}.orbit:before,.orbit:after{content:"";position:absolute;inset:28px;border:1px dashed rgba(175,255,216,.12);border-radius:50%;animation:spin 26s linear infinite}.orbit:after{inset:74px;border-style:solid;opacity:.38;animation-direction:reverse;animation-duration:36s}@keyframes spin{to{transform:rotate(360deg)}}
    .node{position:absolute;z-index:5;display:grid;place-items:center;width:180px;height:180px;border-radius:50%;border:1px solid rgba(175,255,216,.34);background:#111716;box-shadow:0 0 0 12px rgba(114,247,176,.035),0 22px 60px rgba(0,0,0,.42);transition:transform .35s ease,background .35s ease,border-color .35s ease,box-shadow .35s ease}.node:hover{transform:scale(1.08);background:#183326;border-color:var(--green);box-shadow:0 0 0 18px rgba(114,247,176,.07),0 0 70px rgba(114,247,176,.18)}.node.left{left:2%;top:50%;transform:translateY(-50%)}.node.right{right:2%;top:50%;transform:translateY(-50%)}.node.left:hover,.node.right:hover{transform:translateY(-50%) scale(1.08)}.node-content{text-align:center}.node-label{font-size:20px;font-weight:600}.node-sub{display:block;margin-top:8px;color:var(--muted);font-size:12px}.node-dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin:0 auto 16px;box-shadow:0 0 18px var(--green)}
    .sound{position:absolute;color:var(--green);opacity:.7;font-size:18px;animation:float 5s ease-in-out infinite}.s1{left:17%;top:18%;animation-delay:-1s}.s2{right:18%;top:23%;font-size:25px;animation-delay:-3s}.s3{left:25%;bottom:18%;font-size:13px;animation-delay:-2s}.s4{right:27%;bottom:20%;font-size:20px;animation-delay:-4s}@keyframes float{50%{transform:translateY(-14px) rotate(8deg);opacity:.35}}
    .wave{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:430px;height:38px;display:flex;align-items:center;justify-content:center;gap:4px;opacity:.8}.wave i{display:block;width:2px;height:var(--h);background:var(--green);border-radius:4px;animation:beat 1.2s ease-in-out infinite;animation-delay:var(--d)}@keyframes beat{50%{transform:scaleY(.35);opacity:.4}}
    footer{position:absolute;bottom:28px;left:48px;right:48px;display:flex;justify-content:space-between;color:#69736e;font-size:11px;letter-spacing:.08em}.hint{display:flex;align-items:center;gap:8px}.hint b{display:inline-grid;place-items:center;width:20px;height:20px;border:1px solid #45534c;border-radius:50%;font-size:10px;font-weight:500;color:#a8b4ad}
    @media(max-width:760px){header{padding:22px 22px}.top-note{display:none}main{padding:0 18px 70px}.hero{height:640px}.orbit{width:360px;height:360px}.node{width:132px;height:132px}.node.left{left:0;top:18%;transform:none}.node.right{right:0;top:auto;bottom:14%;transform:none}.node.left:hover,.node.right:hover{transform:scale(1.06)}.node-label{font-size:16px}.node-sub{font-size:11px}.copy{margin-top:18px}.copy h1{font-size:40px}.copy p{font-size:13px}.sound{display:none}footer{left:22px;right:22px;bottom:20px}}
  </style>
</head>
<body>
  <div class="page">
    <header><div class="brand">Muse<span>ed</span></div><div class="top-note">A creative space for unfinished ideas</div></header>
    <main><section class="hero" aria-label="Museed 首页概念">
      <div class="orbit"></div>
      <div class="sound s1">♪</div><div class="sound s2">♫</div><div class="sound s3">·</div><div class="sound s4">♩</div>
      <a class="node left" href="#library"><div class="node-content"><div class="node-dot"></div><div class="node-label">灵感库</div><span class="node-sub">收集每个瞬间</span></div></a>
      <div class="copy"><div class="eyebrow">MUSIC / MEMORY / MOTION</div><h1>让每一刻灵感<br><em>都有机会成为一首歌</em></h1><p>记录、整理、延展你的声音碎片。<br>从一个念头开始，和 Museed 一起把它做完。</p></div>
      <a class="node right" href="#create"><div class="node-content"><div class="node-dot"></div><div class="node-label">开始创作</div><span class="node-sub">把想法变成 Demo</span></div></a>
      <div class="wave" aria-hidden="true"><i style="--h:12px;--d:-.1s"></i><i style="--h:21px;--d:-.3s"></i><i style="--h:31px;--d:-.5s"></i><i style="--h:18px;--d:-.7s"></i><i style="--h:27px;--d:-.9s"></i><i style="--h:12px;--d:-1.1s"></i><i style="--h:22px;--d:-.4s"></i><i style="--h:34px;--d:-.2s"></i><i style="--h:16px;--d:-.8s"></i><i style="--h:26px;--d:-.6s"></i><i style="--h:13px;--d:-.1s"></i></div>
    </section></main>
    <footer><span>© 2026 MUSEED</span><span class="hint"><b>↗</b> hover to feel the rhythm</span></footer>
  </div>
</body>
</html>
