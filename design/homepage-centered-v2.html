<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Museed 集中入口首页 V2</title>
  <style>
    :root{--bg:#090b0c;--disc:#0e1411;--ink:#f4f7f5;--muted:#909b95;--green:#72f7b0;--line:rgba(114,247,176,.16)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"PingFang SC",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}body{overflow:hidden}a{color:inherit;text-decoration:none}
    .page{min-height:100svh;display:grid;grid-template-rows:82px 1fr 48px;padding:0 48px}.top,.foot{display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:650}.brand i{font-style:normal;color:var(--green)}.top p,.foot{margin:0;color:#68716c;font-size:10px;text-transform:uppercase}
    .stage{position:relative;display:grid;place-items:center;min-height:700px}.disc{position:relative;width:700px;height:700px;border-radius:50%;background:var(--disc);border:1px solid rgba(114,247,176,.12);display:grid;justify-items:center;align-content:start;text-align:center;padding-top:108px;transition:border-color .3s ease,box-shadow .3s ease}.disc:before,.disc:after{content:"";position:absolute;border-radius:50%;border:1px solid var(--line);pointer-events:none}.disc:before{inset:28px}.disc:after{inset:70px;border-style:dashed;animation:spin 28s linear infinite}
    .active-arc{position:absolute;inset:10px;border-radius:50%;border:2px solid transparent;transform:rotate(-38deg);transition:border-color .3s ease,filter .3s ease}.disc[data-active="library"] .active-arc{border-top-color:var(--green);border-left-color:var(--green);filter:drop-shadow(0 0 8px rgba(114,247,176,.4))}.disc[data-active="create"] .active-arc{border-right-color:var(--green);border-bottom-color:var(--green);filter:drop-shadow(0 0 8px rgba(114,247,176,.4))}.disc[data-clicked="true"] .active-arc{animation:pulse .6s ease}
    .eyebrow{color:var(--green);font-size:11px;text-transform:uppercase;margin:0 0 18px}.disc h1{position:relative;z-index:2;margin:0;font-size:50px;line-height:1.22;font-weight:580}.disc h1 span{color:var(--green)}.desc{position:relative;z-index:2;margin:18px 0 0;color:var(--muted);font-size:13px;line-height:24px}
    .actions{position:relative;z-index:4;display:flex;gap:34px;margin-top:42px}.entry{position:relative;width:166px;height:166px;border-radius:50%;border:1px solid rgba(114,247,176,.36);background:#111917;display:grid;place-items:center;transition:transform .3s ease,border-color .3s ease,background .3s ease,box-shadow .3s ease}.entry:hover,.entry:focus-visible{outline:none;transform:translateY(-5px) scale(1.04);border-color:var(--green);background:#173326;box-shadow:0 0 0 10px rgba(114,247,176,.04),0 0 42px rgba(114,247,176,.14)}.entry-content{display:grid;justify-items:center;gap:8px}.entry svg{color:var(--green);transition:transform .3s ease}.entry:hover svg{transform:scale(1.16)}.entry strong{font-size:18px;font-weight:600}.entry small{color:var(--muted);font-size:11px}.entry-ripple{position:absolute;inset:0;border:1px solid var(--green);border-radius:50%;opacity:0}.entry:hover .entry-ripple,.disc[data-clicked="true"] .entry:hover .entry-ripple{animation:ripple 1.4s ease-out infinite}
    .link-wave{position:absolute;z-index:3;top:456px;left:50%;width:420px;height:80px;transform:translateX(-50%);opacity:.22;transition:opacity .3s ease}.link-wave path{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:4 7}.disc[data-active] .link-wave{opacity:.78}.disc[data-active="library"] .link-wave{transform:translateX(-50%) scaleX(-1)}
    .bars{position:absolute;bottom:52px;left:50%;display:flex;align-items:center;gap:5px;height:38px;transform:translateX(-50%)}.bars i{width:2px;height:var(--h);border-radius:2px;background:var(--green);opacity:.6;animation:beat 1.2s ease-in-out infinite;animation-delay:var(--d)}.disc[data-active] .bars i{opacity:1;animation-duration:.72s}
    .note{position:absolute;color:var(--green);opacity:.36;font-size:20px;animation:float 5s ease-in-out infinite}.n1{left:270px;top:180px}.n2{right:255px;top:235px;font-size:28px;animation-delay:-2s}.n3{right:295px;bottom:160px;animation-delay:-3s}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes beat{50%{transform:scaleY(.3);opacity:.3}}@keyframes float{50%{transform:translateY(-12px);opacity:.7}}@keyframes ripple{from{opacity:.42;transform:scale(.92)}to{opacity:0;transform:scale(1.35)}}@keyframes pulse{50%{transform:rotate(-38deg) scale(1.025)}}
    @media(max-height:800px) and (min-width:721px){.page{grid-template-rows:70px 1fr 36px}.stage{min-height:600px}.disc{width:600px;height:600px;padding-top:70px}.disc:after{inset:60px}.disc h1{font-size:42px}.desc{margin-top:14px}.actions{gap:30px;margin-top:28px}.entry{width:140px;height:140px}.entry strong{font-size:16px}.link-wave{top:372px;width:360px}.bars{bottom:30px}.note{display:none}}
    @media(max-width:720px){body{overflow:auto}.page{padding:0 18px;grid-template-rows:68px 1fr 36px}.top p{display:none}.stage{min-height:760px}.disc{width:min(340px,calc(100vw - 36px));height:auto;aspect-ratio:1;padding-top:52px}.disc:after{inset:38px}.eyebrow{font-size:8px;margin-bottom:10px}.disc h1{font-size:28px}.desc{font-size:10px;line-height:18px;margin-top:10px}.actions{gap:16px;margin-top:26px}.entry{width:122px;height:122px}.entry strong{font-size:15px}.entry small{font-size:9px}.link-wave{top:242px;width:250px}.bars{bottom:20px}.note{display:none}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:1ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <div class="page">
    <header class="top"><a class="brand" href="#">Mus<i>eed</i></a><p>A creative space for unfinished ideas</p></header>
    <main class="stage">
      <span class="note n1">♪</span><span class="note n2">♫</span><span class="note n3">♩</span>
      <section class="disc" id="disc" aria-label="Museed 首页集中入口">
        <span class="active-arc" aria-hidden="true"></span>
        <p class="eyebrow">Music / Memory / Motion</p>
        <h1>让每一刻灵感<br><span>都有机会成为一首歌</span></h1>
        <p class="desc">记录、整理、延展你的声音碎片<br>从一个念头开始，和 Museed 一起把它做完</p>
        <svg class="link-wave" viewBox="0 0 420 80" aria-hidden="true"><path d="M210 8 C210 35 272 22 307 59 C328 81 365 68 397 50"/></svg>
        <nav class="actions" aria-label="页面入口">
          <a class="entry" data-entry="library" href="#library"><span class="entry-ripple"></span><span class="entry-content"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg><strong>灵感库</strong><small>收集每个瞬间</small></span></a>
          <a class="entry" data-entry="create" href="#create"><span class="entry-ripple"></span><span class="entry-content"><svg width="23" height="23" viewBox="0 0 24 24" fill="currentColor"><path d="m7 4 13 8-13 8Z"/></svg><strong>开始创作</strong><small>把想法变成 Demo</small></span></a>
        </nav>
        <div class="bars" aria-hidden="true"><i style="--h:12px;--d:-.1s"></i><i style="--h:22px;--d:-.3s"></i><i style="--h:34px;--d:-.5s"></i><i style="--h:18px;--d:-.7s"></i><i style="--h:28px;--d:-.9s"></i><i style="--h:14px;--d:-1.1s"></i><i style="--h:24px;--d:-.4s"></i><i style="--h:38px;--d:-.2s"></i><i style="--h:18px;--d:-.8s"></i><i style="--h:30px;--d:-.6s"></i></div>
      </section>
    </main>
    <footer class="foot"><span>© 2026 MUSEED</span><span>Ideas become sound</span></footer>
  </div>
  <script>
    const disc = document.querySelector('#disc');
    document.querySelectorAll('[data-entry]').forEach((entry) => {
      entry.addEventListener('mouseenter', () => disc.dataset.active = entry.dataset.entry);
      entry.addEventListener('focus', () => disc.dataset.active = entry.dataset.entry);
      entry.addEventListener('mouseleave', () => delete disc.dataset.active);
      entry.addEventListener('blur', () => delete disc.dataset.active);
      entry.addEventListener('click', (event) => {
        event.preventDefault();
        disc.dataset.active = entry.dataset.entry;
        disc.dataset.clicked = 'true';
        window.setTimeout(() => delete disc.dataset.clicked, 650);
      });
    });
  </script>
</body>
</html>
